name: Idea OS v2 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    # Windows-only by design: canon identity roots are absolute Windows
    # paths, so POSIX runners fail check_identity_sync and the cold-start
    # test. Ubuntu grep is unavailable here, hence the pwsh Select-String
    # scan below. The roots themselves are canon values (governance/), never
    # restated in code or CI.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tools
        run: >-
          python -m pip install
          "ruff==0.16.3" "pytest>=9.1.1"
      - name: Fast tests (smoke excluded by pyproject addopts)
        run: python -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: "Drive-letter scan (roots live in canon, never in code)"
        shell: pwsh
        run: |
          $hits = Select-String -Path pipelines/*.py,cli.py -Pattern '(?<![A-Za-z0-9])[A-Za-z]:[\\/]'
          if ($hits) {
            $hits | ForEach-Object { Write-Output "$($_.Filename):$($_.LineNumber): $($_.Line)" }
            Write-Output "hardcoded drive letter found outside canon"
            exit 1
          }
      - name: README command-table consistency
        run: python -m pytest tests/test_docs.py -q
