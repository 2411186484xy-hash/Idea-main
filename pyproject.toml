[project]
name = "idea-incubation-os"
version = "2.0.0"
description = "Literature deep-read and idea-incubation OS. Ends at idea delivery; researcher feedback is the only validation signal."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
zotero = ["pyzotero>=1.13.4"]  # urschrei/pyzotero (BlueOak-1.0.0); session-side write face only
pdf = ["pymupdf>=1.28.2"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
addopts = '-m "not smoke"'
testpaths = ["tests"]
markers = ["smoke: external-service reachability, off by default"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
